[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: tests that require external infrastructure",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101: assert is fine in a codebase with no -O deployment.
# B008: Depends(...)/Query(...) in a default argument is FastAPI's documented DI
# pattern, not the mutable-default-argument bug this rule is meant to catch.
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic generates create_table/create_index calls on single long lines;
# reformatting them by hand fights every future autogenerate diff.
"alembic/versions/*.py" = ["E501"]
