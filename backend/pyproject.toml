[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: tests that require external infrastructure",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Alembic generates create_table/create_index calls on single long lines;
# reformatting them by hand fights every future autogenerate diff.
"alembic/versions/*.py" = ["E501"]
