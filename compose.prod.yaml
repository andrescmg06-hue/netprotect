name: netprotect-prod

# Sprint 26: backend/web/migrate carry both `image:` and `build:` on purpose — `docker compose
# build` (local verification, docs/sprint-26-evidence.md) builds from source same as before;
# `docker compose pull` (the real deploy path, .github/workflows/cd.yml's deploy-production job)
# instead fetches the tag build-and-push already pushed to GHCR, with no local build step and no
# source checkout needed on the production host at all. BACKEND_IMAGE/WEB_IMAGE let a real deploy
# pin an exact `sha-<commit>` tag instead of always floating on `latest`; unset, both default to
# `latest` in this repository's own GHCR namespace.

# Sprint 26: every service gets the same rotation instead of the unbounded default json-file
# driver — a production host left running for months must not fill its disk with old container
# logs. Promtail (below) still gets everything before rotation deletes it, at the same cadence
# Grafana's "Backend logs" panel reads from Loki.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Sprint 71: every service has a `mem_limit` so one runaway process (a leak, a heavy Grafana
# query, a pg_dump spike) is OOM-killed and restarted on its own instead of starving PostgreSQL
# or the API on a small VPS. The values are ceilings sized from what each process is known to do
# here, not measurements under real load: revisit them with the Grafana dashboard after go-live.

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    # Default postgres settings (128MB shared_buffers) plus one connection pool from a single
    # uvicorn worker; the rest of the ceiling is page cache and pg_dump's backend process.
    mem_limit: 1g
    volumes:
      - postgres_prod_data:/var/lib/postgresql
    networks:
      - private

  redis:
    image: redis:8.2-alpine
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$(cat $$REDIS_PASSWORD_FILE)"']
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat $$REDIS_PASSWORD_FILE)\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    # Holds only rate-limit counters with short TTLs; the AOF rewrite fork is the peak.
    mem_limit: 256m
    volumes:
      - redis_prod_data:/data
    networks:
      - private

  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/andrescmg06-hue/netprotect/backend:latest}
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    # One short-lived alembic process.
    mem_limit: 256m
    networks:
      - private

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/andrescmg06-hue/netprotect/backend:latest}
    build:
      context: ./backend
      target: runtime
    environment:
      APP_ENV: production
      APP_VERSION: ${APP_VERSION}
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      CORS_ORIGINS: ${CORS_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      PAIRING_CODE_PEPPER_FILE: /run/secrets/pairing_code_pepper
      LOCATION_ENCRYPTION_KEY_FILE: /run/secrets/location_encryption_key
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Sprint 71: FCM stays optional. With FCM_PROJECT_ID unset both values are blank (push
      # disabled); once it is set, the backend reads the key from the `fcm_service_account`
      # secret below, and app/core/config.py refuses to start if that file is missing or empty.
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_PROJECT_ID:+/run/secrets/fcm_service_account}
      WEBRTC_STUN_URLS: ${WEBRTC_STUN_URLS:-stun:stun.l.google.com:19302}
      # Sprint 28: same Compose secret the `coturn` service verifies against.
      TURN_SHARED_SECRET_FILE: /run/secrets/turn_shared_secret
      TURN_URLS: ${TURN_URLS:?falta TURN_URLS}
    secrets:
      - database_url
      - redis_url
      - jwt_secret
      - pairing_code_pepper
      - location_encryption_key
      - turn_shared_secret
      - fcm_service_account
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Sprint 71: /health/ready checks PostgreSQL and Redis, so "healthy" means able to serve.
    # The image already ships python, so no curl is installed for this. The Host header is the
    # first ALLOWED_HOSTS entry because TrustedHostMiddleware (app/main.py) rejects any other,
    # including 127.0.0.1; /health is exempt from https_required, so plain HTTP is fine here.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as r; h = os.environ['ALLOWED_HOSTS'].split(',')[0].strip(); r.urlopen(r.Request('http://127.0.0.1:8000/api/v1/health/ready', headers={'Host': h}), timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    # One uvicorn worker (backend/Dockerfile) plus the in-memory WebSocket registry.
    mem_limit: 512m
    # No published host port on purpose (Sprint 26): Caddy is now the only container with a port
    # published to the host, reached over the `edge` network by its container DNS name (backend).
    # /metrics stays reachable only from other containers on `private` (Prometheus) — see
    # app/main.py's comment on why that's sufficient instead of adding auth to that one route.
    networks:
      - private
      - edge

  web:
    image: ${WEB_IMAGE:-ghcr.io/andrescmg06-hue/netprotect/web:latest}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID}
    depends_on:
      backend:
        condition: service_healthy
    # node is already in the image (frontend/Dockerfile); any answer below 500 means the
    # standalone server is up and rendering.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((res) => process.exit(res.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    # Next.js standalone server (node), no build happens on the host.
    mem_limit: 512m
    # No published host port either (Sprint 26) — same reasoning as backend, reached by Caddy
    # over `edge` as `web`.
    networks:
      - edge

  caddy:
    image: caddy:2.10-alpine
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Per-site snippets for the static sites below; written on the host, outside this repository.
      # Caddy sees only these snippets, never the site files themselves.
      - /srv/sites/conf:/etc/caddy/sites.d:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    # Caddy's admin API listens on localhost:2019 by default and only answers once the config is
    # loaded; busybox wget ships with the alpine image.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    # Reverse proxy and TLS only; request bodies are capped in the Caddyfile.
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    networks:
      - edge

  # Static sites for other projects hosted on this server (infra/sites/README.md). Deliberately
  # isolated from the application: unprivileged nginx, read-only filesystem, no capabilities, no
  # secrets and no database mounted, 64 MB. It only sees /srv/sites/www, read-only, and Caddy
  # (which terminates TLS per domain) forwards to it on the `edge` network.
  sites:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - /srv/sites/www:/srv/sites/www:ro
      - ./infra/sites/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

  # Sprint 28: TURN relay for remote view (docs/planning/plan-turn.md). On its own `turn` network
  # only: it must be reachable from the internet but has no business on `private` next to db and
  # redis, and denied-peer-ip (infra/coturn/turnserver.conf) is a second barrier, not the only one.
  # The secret arrives as a Compose secret, never an env var (entrypoint.sh). TURN_EXTERNAL_IP is
  # the host's public IPv4, which clients are told to send to; it is required here because a relay
  # that advertises its container address would be unreachable from outside.
  coturn:
    image: coturn/coturn:4.7.0
    entrypoint: ["sh", "/etc/coturn/netprotect/entrypoint.sh"]
    environment:
      TURN_SHARED_SECRET_FILE: /run/secrets/turn_shared_secret
      TURN_REALM: ${TURN_REALM:?falta TURN_REALM}
      TURN_RELAY_IP: 172.30.97.10
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:?falta TURN_EXTERNAL_IP}
    secrets:
      - turn_shared_secret
    volumes:
      - ./infra/coturn:/etc/coturn/netprotect:ro
    restart: unless-stopped
    logging: *default-logging
    # A relay for a handful of concurrent remote-view sessions (user-quota 16 in turnserver.conf).
    mem_limit: 256m
    # Every port here must also be open in the host firewall (docs/manuals/manual-despliegue.md).
    # The relay range matches min-port/max-port in turnserver.conf.
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    networks:
      turn:
        ipv4_address: 172.30.97.10

  # Sprint 26: pg_dump on a timer (infra/backup/backup.sh), custom format, pruned by
  # BACKUP_RETENTION_DAYS. Restoring is deliberately never automatic — see restore.sh's comment —
  # so this service only ever writes into backups_data, it never reads from it.
  backup:
    image: postgres:18.6-alpine
    entrypoint: ["/scripts/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    secrets:
      - postgres_password
    volumes:
      - ./infra/backup:/scripts:ro
      - backups_data:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # pg_dump streams to disk; it does not hold the database in memory.
    mem_limit: 256m
    networks:
      - private

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    logging: *default-logging
    # Two scrape targets at 15s; the head block and WAL replay on restart are the peak.
    mem_limit: 512m
    # Deliberately not on `edge` and not routed to by Caddy — Prometheus has no login of its own,
    # unlike Grafana, so it stays reachable only from other containers on `private`.
    networks:
      - private

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    logging: *default-logging
    # Dashboard queries run here; a wide log query is the realistic spike.
    mem_limit: 512m
    # Sprint 26 scope decision (see docs/sprint-26.md): bound to the host's loopback only, not
    # routed through Caddy and not on `edge` — an operator reaches it through an SSH tunnel
    # (`ssh -L 3000:127.0.0.1:3000 user@host`), not a public URL. Publishing this still works even
    # though `private` is `internal: true`: that flag blocks the network's containers from
    # reaching *out* to the internet, not the host's inbound DNAT for a published port — the same
    # reason db/redis's dev compose can publish 127.0.0.1:5432/6379 despite being on the same kind
    # of internal network (see B6 in docs/planning/plan-desarrollo.md). Giving Grafana its own
    # public subdomain later is one more Caddy site block plus one more DNS record away —
    # deliberately left for whoever picks the real production host, the same "pending a human
    # with a real domain" situation as WEB_DOMAIN/API_DOMAIN themselves.
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - private

  loki:
    image: grafana/loki:3.3.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infra/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    logging: *default-logging
    # Single-binary Loki ingesting this host's container logs only.
    mem_limit: 512m
    networks:
      - private

  promtail:
    image: grafana/promtail:3.3.0
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./infra/monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    restart: unless-stopped
    logging: *default-logging
    # Tails container log files and ships them to Loki.
    mem_limit: 256m
    networks:
      - private

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  database_url:
    file: ./secrets/database_url.txt
  redis_url:
    file: ./secrets/redis_url.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  pairing_code_pepper:
    file: ./secrets/pairing_code_pepper.txt
  location_encryption_key:
    file: ./secrets/location_encryption_key.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  turn_shared_secret:
    file: ./secrets/turn_shared_secret.txt
  # Sprint 71: optional, unlike every secret above. FCM_SERVICE_ACCOUNT_SECRET_FILE is the host
  # path of the Firebase service-account JSON (./secrets/fcm_service_account.json by convention);
  # unset, /dev/null is mounted so the stack still starts on a host without Firebase.
  fcm_service_account:
    file: ${FCM_SERVICE_ACCOUNT_SECRET_FILE:-/dev/null}

volumes:
  postgres_prod_data:
  redis_prod_data:
  caddy_data:
  caddy_config:
  backups_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  private:
    internal: true
  edge:
    driver: bridge
  turn:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.97.0/24
