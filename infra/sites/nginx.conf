# Static sites for other projects (see infra/sites/README.md). One directory per domain under
# /srv/sites/www, named exactly like the domain. TLS is terminated by Caddy; this server only ever
# receives plain HTTP from it on the private `edge` network.
server {
    listen 8080 default_server;
    server_name _;

    # Only hosts of the expected shape are served; anything else gets the connection closed. This
    # also keeps `$host` safe to use as a path segment below (no slashes, no dots-only labels).
    if ($host !~ "^[a-z0-9]([a-z0-9-]*[a-z0-9])?\.netprotectapp\.online$") { return 444; }

    root /srv/sites/www/$host;
    index index.html;

    # A site's own files must never be able to point elsewhere on the filesystem.
    disable_symlinks on;
    autoindex off;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Dotfiles (.env, .git, ...) are never served, even if uploaded by mistake.
    location ~ /\. { return 404; }

    location / { try_files $uri $uri/ =404; }
}
