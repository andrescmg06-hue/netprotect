# Sprint 28: the TURN relay for remote view (docs/planning/plan-turn.md). Versioned and identical
# in every environment; what differs per environment (the shared secret, realm, relay IP, public
# IP) is appended at start-up by entrypoint.sh, so this file never holds a secret.

listening-port=3478
# The relay range is deliberately small: each screen-sharing peer holds one allocation, and every
# port here has to be published on a production host (docs/manuals/manual-despliegue.md).
min-port=49160
max-port=49200

# Ephemeral credentials only (plan D2): the backend signs `<expiry>:<id>` with the shared secret
# and coturn verifies it with no call back to the backend. There is no static user to leak.
use-auth-secret
fingerprint
stale-nonce=600

# Plain `turn:` only (plan D5): media is already DTLS-SRTP end to end, and `turns:` needs a real
# domain and certificate, which is still pending since Sprint 26.
no-tls
no-dtls

# WebRTC media is UDP; relaying TCP to peers would only widen what this server can be used to reach.
no-tcp-relay
no-cli
no-rfc5780
no-software-attribute

# Caps per credential and overall, so a leaked credential can't turn the relay into free bandwidth.
# user-quota is per credential, not per session: one peer connection opens an allocation for every
# local network interface x TURN URL x transport, and a Windows host with Docker/WSL adapters has
# several. 4 was measured to reject a single test session (486 Allocation Quota Reached), 8 passed
# (docs/sprint-28-evidence.md); 16 leaves room for hosts with more interfaces. total-quota can't
# usefully exceed the 41 relay ports above.
user-quota=16
total-quota=40

# Never relay into private, loopback, link-local or CGNAT space: without this, an authenticated
# client could use the relay to reach services on the server's own network (plan D7). The
# relay's own address is re-allowed by entrypoint.sh (allowed-peer-ip), which Spike R1 showed is
# required for two peers on the same relay to reach each other (docs/sprint-28-evidence.md).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
