name: netprotect-dev

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netprotect}
      POSTGRES_USER: ${POSTGRES_USER:-netprotect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netprotect} -d ${POSTGRES_DB:-netprotect}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    networks:
      - netprotect

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - netprotect

  migrate:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL en .env}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - netprotect

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0-sprint1}
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL en .env}
      REDIS_URL: ${REDIS_URL:?falta REDIS_URL en .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,10.0.2.2}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:?falta GOOGLE_WEB_CLIENT_ID en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      PAIRING_CODE_PEPPER: ${PAIRING_CODE_PEPPER:?falta PAIRING_CODE_PEPPER en .env}
      LOCATION_ENCRYPTION_KEY: ${LOCATION_ENCRYPTION_KEY:?falta LOCATION_ENCRYPTION_KEY en .env}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      # Sprint 28: signs credentials the `coturn` service below verifies, so it must be the same
      # value. Both relay addresses are sent because the backend can't tell which client asks:
      # the host browser reaches coturn as localhost, the Android emulator as 10.0.2.2.
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?falta TURN_SHARED_SECRET en .env}
      TURN_URLS: ${TURN_URLS:-turn:localhost:3478?transport=udp,turn:10.0.2.2:3478?transport=udp}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - netprotect

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID:?falta NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID en .env}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID:?falta NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID en .env}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - netprotect

  # Sprint 28: TURN relay for remote view (docs/planning/plan-turn.md). Alone on its own network,
  # never on `netprotect`: even before denied-peer-ip (infra/coturn/turnserver.conf) it has no
  # route to db/redis. The fixed address is required by allowed-peer-ip (Spike R1,
  # docs/sprint-28-evidence.md). Bound to 127.0.0.1 like db/redis: the host browser reaches it as
  # localhost and the Android emulator as 10.0.2.2, which the emulator maps onto the host loopback.
  coturn:
    image: coturn/coturn:4.7.0
    restart: unless-stopped
    entrypoint: ["sh", "/etc/coturn/netprotect/entrypoint.sh"]
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?falta TURN_SHARED_SECRET en .env}
      TURN_REALM: ${TURN_REALM:-netprotect.local}
      TURN_RELAY_IP: 172.30.99.10
    volumes:
      - ./infra/coturn:/etc/coturn/netprotect:ro
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:3478:3478/tcp"
    networks:
      turn:
        ipv4_address: 172.30.99.10

volumes:
  postgres_dev_data:
    name: netprotect_postgres_dev_data
  redis_dev_data:
    name: netprotect_redis_dev_data

networks:
  netprotect:
    name: netprotect_network
    driver: bridge
  turn:
    name: netprotect_turn_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.99.0/24
