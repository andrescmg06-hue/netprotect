name: netprotect-test

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: netprotect_test
      POSTGRES_USER: netprotect_test
      POSTGRES_PASSWORD: change_me_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netprotect_test -d netprotect_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql
    networks:
      - netprotect_test

  redis:
    image: redis:8.2-alpine
    command: ["sh", "-c", 'exec redis-server --save "" --appendonly no --requirepass "$${REDIS_PASSWORD}"']
    environment:
      REDIS_PASSWORD: change_me_redis_test_only
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data
    networks:
      - netprotect_test

  # Run explicitly with `docker compose -f compose.test.yaml run --rm migrate` before
  # `up --abort-on-container-exit`, NOT via a `depends_on` on `backend`: that flag aborts
  # the whole stack as soon as ANY container exits, and this one-shot service exits by
  # design, killing `backend` before its tests even start. See ci.yml / Makefile.
  migrate:
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgresql+asyncpg://netprotect_test:change_me_test_only@db:5432/netprotect_test
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - netprotect_test

  backend:
    build:
      context: ./backend
      target: test
    environment:
      APP_ENV: test
      APP_VERSION: 0.1.0-sprint1
      DATABASE_URL: postgresql+asyncpg://netprotect_test:change_me_test_only@db:5432/netprotect_test
      REDIS_URL: redis://:change_me_redis_test_only@redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,testserver
      GOOGLE_WEB_CLIENT_ID: test-client-id.apps.googleusercontent.com
      JWT_SECRET: change_me_test_only_jwt_secret_at_least_32_bytes_long
      PAIRING_CODE_PEPPER: change_me_test_only_pairing_pepper_at_least_32_byte
      LOCATION_ENCRYPTION_KEY: KkxP1iS9ZDOzTx6NGgiAftFSQrsczN4j7bHr8_yd7VI=
      # Sprint 28: must match the `coturn` service below, so a credential this backend issues is
      # one that relay really accepts (docs/sprint-28-evidence.md).
      TURN_SHARED_SECRET: change_me_test_only_turn_shared_secret_at_least_32
      TURN_URLS: turn:172.30.98.10:3478?transport=udp
      LOG_LEVEL: WARNING
      RUN_INTEGRATION_TESTS: "1"
      # Sprint 21: the whole suite runs hundreds of requests a minute from a single simulated
      # address, which the production default (300/min per IP) rightly treats as abuse. Raised
      # here so unrelated tests don't fail on a shared budget; the tests that actually exercise
      # the limiter set their own value per test (tests/test_security_hardening_integration.py).
      RATE_LIMIT_GLOBAL_MAX_PER_IP: "100000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - netprotect_test

  # Sprint 25: `backend` above runs pytest and exits — no good for Newman/Playwright/k6, which
  # need a real HTTP server to hit. Same image (built once, shared build cache with `backend` and
  # `migrate`), same database, just a different command and a published port. Kept in this file
  # rather than a separate compose file so it can never drift out of sync with the env vars the
  # `backend` test service already gets right.
  api_server:
    build:
      context: ./backend
      target: test
    environment:
      APP_ENV: test
      APP_VERSION: 0.1.0-sprint1
      DATABASE_URL: postgresql+asyncpg://netprotect_test:change_me_test_only@db:5432/netprotect_test
      REDIS_URL: redis://:change_me_redis_test_only@redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,api_server,testserver
      GOOGLE_WEB_CLIENT_ID: test-client-id.apps.googleusercontent.com
      JWT_SECRET: change_me_test_only_jwt_secret_at_least_32_bytes_long
      PAIRING_CODE_PEPPER: change_me_test_only_pairing_pepper_at_least_32_byte
      LOCATION_ENCRYPTION_KEY: KkxP1iS9ZDOzTx6NGgiAftFSQrsczN4j7bHr8_yd7VI=
      TURN_SHARED_SECRET: change_me_test_only_turn_shared_secret_at_least_32
      TURN_URLS: turn:172.30.98.10:3478?transport=udp
      LOG_LEVEL: WARNING
      # Newman/Playwright/k6 all hit this from outside the container at whatever pace their
      # scripts run at — not the hundreds-of-requests-a-minute pytest suite, but still enough
      # to want headroom rather than tripping the production default (300/min per IP).
      RATE_LIMIT_GLOBAL_MAX_PER_IP: "100000"
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - netprotect_test

  # Sprint 28: the same relay config as compose.yaml/compose.prod.yaml, so the integration tests
  # exercise the real hardened coturn, not a permissive one. Its own network with a fixed address
  # for allowed-peer-ip (Spike R1, docs/sprint-28-evidence.md); the TURN client used by the tests
  # joins `turn_test`, the database never does.
  coturn:
    image: coturn/coturn:4.7.0
    entrypoint: ["sh", "/etc/coturn/netprotect/entrypoint.sh"]
    environment:
      TURN_SHARED_SECRET: change_me_test_only_turn_shared_secret_at_least_32
      TURN_REALM: netprotect.test
      TURN_RELAY_IP: 172.30.98.10
    volumes:
      - ./infra/coturn:/etc/coturn/netprotect:ro
    networks:
      turn_test:
        ipv4_address: 172.30.98.10

networks:
  netprotect_test:
    driver: bridge
  turn_test:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.98.0/24
