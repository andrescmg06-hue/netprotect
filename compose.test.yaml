name: netprotect-test

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: netprotect_test
      POSTGRES_USER: netprotect_test
      POSTGRES_PASSWORD: change_me_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netprotect_test -d netprotect_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql
    networks:
      - netprotect_test

  redis:
    image: redis:8.2-alpine
    command: ["sh", "-c", 'exec redis-server --save "" --appendonly no --requirepass "$${REDIS_PASSWORD}"']
    environment:
      REDIS_PASSWORD: change_me_redis_test_only
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data
    networks:
      - netprotect_test

  # Run explicitly with `docker compose -f compose.test.yaml run --rm migrate` before
  # `up --abort-on-container-exit`, NOT via a `depends_on` on `backend`: that flag aborts
  # the whole stack as soon as ANY container exits, and this one-shot service exits by
  # design, killing `backend` before its tests even start. See ci.yml / Makefile.
  migrate:
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgresql+asyncpg://netprotect_test:change_me_test_only@db:5432/netprotect_test
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - netprotect_test

  backend:
    build:
      context: ./backend
      target: test
    environment:
      APP_ENV: test
      APP_VERSION: 0.1.0-sprint1
      DATABASE_URL: postgresql+asyncpg://netprotect_test:change_me_test_only@db:5432/netprotect_test
      REDIS_URL: redis://:change_me_redis_test_only@redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,testserver
      GOOGLE_WEB_CLIENT_ID: test-client-id.apps.googleusercontent.com
      JWT_SECRET: change_me_test_only_jwt_secret_at_least_32_bytes_long
      PAIRING_CODE_PEPPER: change_me_test_only_pairing_pepper_at_least_32_byte
      LOG_LEVEL: WARNING
      RUN_INTEGRATION_TESTS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - netprotect_test

networks:
  netprotect_test:
    driver: bridge
